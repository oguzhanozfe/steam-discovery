version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Keep automated security fixes active without filling the public repo with
    # routine version-update pull requests. Compatible upgrades are reviewed in
    # a deliberate maintenance pass instead.
    open-pull-requests-limit: 0
    groups:
      security-patches:
        applies-to: security-updates
        patterns: ["*"]
