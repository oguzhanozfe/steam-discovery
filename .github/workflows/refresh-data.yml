name: Daily Steam data refresh
on:
  schedule:
    # 05:17 UTC daily, after SteamSpy's daily provider refresh.
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      spy:
        description: SteamSpy appdetails checks this run
        default: '1500'
      store:
        description: Steam store appdetails checks this run
        default: '600'
permissions:
  contents: write
concurrency:
  group: refresh-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Refresh catalog and curated checks
        run: node scripts/refresh-radar.mjs
      - name: Enrich a batch of catalog games
        env:
          SPY_LIMIT: ${{ inputs.spy || '1500' }}
          STORE_LIMIT: ${{ inputs.store || '600' }}
        run: node scripts/enrich-apps.mjs --spy="$SPY_LIMIT" --store="$STORE_LIMIT"
      - name: Record dated history
        run: node scripts/record-history.mjs
      - name: Build and validate
        run: |
          pnpm build:vercel
          pnpm exec tsc --noEmit
          pnpm validate:research
          pnpm validate:readability
          pnpm validate:citations
          pnpm validate:public
          pnpm validate:steam
      - name: Commit refreshed data
        run: |
          git config user.name "steam-discovery-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/radar-catalog.json app/data/radar-snapshot.json app/data/game-images.json data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: daily Steam refresh $(date -u +%F)"
            git push
          fi
      - name: Deploy to Vercel production
        if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        run: |
          npx --yes vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
      - name: Deployment skipped
        if: env.VERCEL_TOKEN == '' || env.VERCEL_ORG_ID == '' || env.VERCEL_PROJECT_ID == ''
        run: echo "::notice::Data committed but not deployed. Add VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID repository secrets to auto-deploy."
